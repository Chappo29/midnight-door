<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Кнопки HUD — оформление</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/src/style.css" />
<style>
  html, body { height: auto; overflow: auto; background: var(--night-4); touch-action: pan-y; }
  body { padding: 20px 12px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; color: #fff; }
  h1 { font-family: var(--font-head); font-weight: 900; font-size: 26px; margin: 0; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
  .sub { font-family: var(--font-body); font-weight: 700; font-size: 14px; color: rgba(255,255,255,.72); margin: 0; text-align: center; max-width: 900px; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 300px; }
  .lab { display: flex; gap: 8px; align-items: center; font-family: var(--font-head); font-weight: 800; font-size: 16px; }
  .letter { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: var(--ink); background: linear-gradient(180deg, var(--amber-light), var(--amber) 55%, var(--amber-dark)); box-shadow: 0 0 0 2px var(--ink); font-weight: 900; font-size: 14px; }
  .note { font-family: var(--font-body); font-weight: 700; font-size: 12.5px; line-height: 1.35; text-align: center; color: rgba(255,255,255,.8); margin: 0; }
  /* Кадр матча 390×844, уменьшенный до 300 px. */
  .phone { position: relative; width: 300px; height: 649px; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px #3b3358;
    background: url(/docs/ui-mockups/gen/match-bg.png) center / 100% 100%; }
  .phone .b { position: absolute; display: flex; align-items: center; justify-content: center; }
  .phone .b img { width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 1; }
  /* Позиции как в игре (×300/390). */
  .p-pause { right: 8px; top: 8px; } .p-sound { right: 8px; top: 57px; }
  .p-home { left: 12px; bottom: 12px; } .p-rep { right: 14px; bottom: 12px; }
  .sm { width: 40px; height: 40px; } .lg { width: 58px; height: 58px; }

  /* Г — как сейчас: наклейка. */
  .v-now .b img { filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 0 rgba(15,10,26,.55)); }

  /* А — кремовая плашка как у счётчиков сверху. */
  .v-cream .b { border-radius: 16px; background: linear-gradient(180deg, #fff 0%, var(--cream) 60%, var(--cream-dark) 100%); box-shadow: 0 0 0 3px var(--ink), 0 4px 0 var(--ink); }
  .v-cream .b.lg { border-radius: 20px; }
  .v-cream .b img { width: 78%; height: 78%; }

  /* Б — тёмное стекло: плашка ночи с белой рамкой, иконка светится. */
  .v-glass .b { border-radius: 16px; background: rgba(28, 19, 48, 0.72); box-shadow: 0 0 0 2.5px rgba(255,255,255,.9), 0 0 0 5px var(--ink), 0 4px 0 5px rgba(0,0,0,.25); backdrop-filter: blur(3px); }
  .v-glass .b.lg { border-radius: 20px; }
  .v-glass .b img { width: 76%; height: 76%; filter: drop-shadow(0 2px 0 rgba(0,0,0,.5)); }

  /* В — капсула: пауза+звук в одной плашке, как счётчики; внизу — кремовые плашки с подписью. */
  .v-caps .caps { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 2px; padding: 4px; border-radius: 18px;
    background: linear-gradient(180deg, #fff 0%, var(--cream) 60%, var(--cream-dark) 100%); box-shadow: 0 0 0 3px var(--ink), 0 4px 0 var(--ink); }
  .v-caps .caps .b { position: static; width: 36px; height: 36px; }
  .v-caps .caps .b + .b { border-top: 2px solid rgba(28,19,48,.15); padding-top: 2px; }
  .v-caps .p-home, .v-caps .p-rep { flex-direction: column; border-radius: 20px; width: 62px; height: 70px; padding-top: 3px;
    background: linear-gradient(180deg, #fff 0%, var(--cream) 60%, var(--cream-dark) 100%); box-shadow: 0 0 0 3px var(--ink), 0 4px 0 var(--ink); }
  .v-caps .p-home img, .v-caps .p-rep img { width: 44px; height: 44px; flex: none; }
  .v-caps .cap { font-family: var(--font-head); font-weight: 900; font-size: 11px; color: var(--ink); line-height: 1; margin-top: 1px; }
</style>
</head>
<body>
<h1>Кнопки в матче: 4 оформления</h1>
<p class="sub">Настоящий кадр матча на телефоне, иконки — выбранные. Без подложки кровать читается как мебель на полу, а пауза и звук «висят» рядом с белыми счётчиками. Варианты А–В дают кнопкам плашку, но не круглую.</p>
<div class="row" id="row"></div>
<script type="module">
const I = (n) => `<img src="/src/assets/ui/${n}.png" alt="">`;
const std = (v) => `<div class="phone ${v}">
  <div class="b sm p-pause">${I('pause')}</div><div class="b sm p-sound">${I('sound_on')}</div>
  <div class="b lg p-home">${I('home')}</div><div class="b lg p-rep">${I('repair')}</div></div>`;
const caps = `<div class="phone v-caps">
  <div class="caps"><div class="b">${I('pause')}</div><div class="b">${I('sound_on')}</div></div>
  <div class="b p-home">${I('home')}<span class="cap">Домой</span></div>
  <div class="b p-rep">${I('repair')}<span class="cap">Чинить</span></div></div>`;
const V = [
  ['А', 'Кремовая плашка', std('v-cream'), 'Скруглённый квадрат того же цвета и с той же обводкой, что счётчики конфет и таймер. Весь HUD в одном стиле, кнопки не путаются с мебелью.'],
  ['Б', 'Тёмное стекло', std('v-glass'), 'Полупрозрачная ночная плашка с белой рамкой: иконка ярко светится на ней и меньше закрывает карту.'],
  ['В', 'Капсула + подписи', caps, 'Пауза и звук собраны в одну плашку, как счётчики. Внизу кремовые плашки с подписью «Домой» / «Чинить», как у кнопок «Бу!» и «Искра».'],
  ['Г', 'Сейчас: наклейка', std('v-now'), 'Без подложки — для сравнения.'],
];
document.getElementById('row').innerHTML = V.map(([l, t, ph, n]) => `<div class="col"><div class="lab"><span class="letter">${l}</span>${t}</div>${ph}<p class="note">${n}</p></div>`).join('');
</script>
</body>
</html>
